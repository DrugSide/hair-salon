<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12110f">
  <meta name="description" content="Парикмахерская «У Трухиных». Четыре мастера, два адреса и внимательное отношение к вашему образу.">
  <title>У Трухиных — парикмахерская</title>
</head>
<body>
  <div id="app"></div>
  <script>
    class TrukhinyLanding {
      constructor(root = document.getElementById("app")) {
        if (!root) return;
        this.root = root;
        this.injectStyles();
        this.root.innerHTML = this.markup();
        this.dialog = this.root.querySelector("#booking-dialog");
        this.form = this.root.querySelector("#booking-form");
        this.success = this.root.querySelector("#booking-success");
        this.header = this.root.querySelector(".site-header");
        this.bindEvents();
        this.root.querySelector("[data-year]").textContent = new Date().getFullYear();
      }

      injectStyles() {
        const style = document.createElement("style");
        style.textContent = `
          :root {
            color-scheme: dark;
            --ink: #12110f;
            --ink-2: #181715;
            --panel: #1e1c19;
            --panel-2: #24211d;
            --cream: #eee8df;
            --muted: #aaa198;
            --copper: #c58b5d;
            --gold: #e0bd91;
            --line: rgba(224, 189, 145, .2);
            --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
            --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
            --ease: cubic-bezier(.2,.75,.25,1);
          }
          *, *::before, *::after { box-sizing: border-box; }
          html { scroll-behavior: smooth; scroll-padding-top: 92px; background: var(--ink); }
          body {
            margin: 0; min-width: 320px; background: var(--ink); color: var(--cream);
            font: 15px/1.65 var(--sans); letter-spacing: .01em; overflow-x: hidden;
            -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
          }
          body::before {
            content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .15;
            background-image: radial-gradient(rgba(245,225,197,.2) .55px, transparent .75px);
            background-size: 5px 5px; mask-image: linear-gradient(to bottom, black, transparent 85%);
          }
          button, input, select, textarea { font: inherit; }
          button, a { -webkit-tap-highlight-color: transparent; }
          button { color: inherit; }
          a { color: inherit; text-decoration: none; }
          img, svg { max-width: 100%; }
          ::selection { background: var(--copper); color: #171411; }
          :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
          .skip-link {
            position: fixed; top: 12px; left: 12px; z-index: 300; padding: 10px 14px;
            transform: translateY(-180%); background: var(--gold); color: var(--ink); border-radius: 2px;
          }
          .skip-link:focus { transform: translateY(0); }
          .container { width: min(1320px, calc(100% - 88px)); margin-inline: auto; }
          .site-header {
            position: fixed; inset: 0 0 auto; z-index: 100; border-bottom: 1px solid rgba(231,213,189,.1);
            background: rgba(18,17,15,.78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            transition: background .35s ease, box-shadow .35s ease, border-color .35s ease;
          }
          .site-header.is-scrolled { background: rgba(18,17,15,.95); box-shadow: 0 12px 35px rgba(0,0,0,.2); border-color: var(--line); }
          .header-inner {
            width: min(1440px, calc(100% - 88px)); height: 84px; margin-inline: auto;
            display: flex; align-items: center; justify-content: space-between; gap: 28px;
          }
          .brand { display: inline-flex; align-items: center; gap: 12px; flex: 0 0 auto; }
          .brand-mark {
            display: grid; place-items: center; width: 43px; height: 43px; border: 1px solid rgba(224,189,145,.58);
            color: var(--gold); font: 22px/1 var(--serif); letter-spacing: -.08em; transform: rotate(-3deg);
          }
          .brand-name { display: block; color: var(--cream); font: 18px/1.05 var(--serif); letter-spacing: .015em; }
          .brand-caption { display: block; margin-top: 5px; color: #a89c8e; font: 9px/1.2 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
          .desktop-nav { display: flex; align-items: center; gap: clamp(20px, 3vw, 44px); margin-left: auto; }
          .desktop-nav a, .footer-nav a {
            position: relative; color: #c3bbb1; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
            transition: color .25s ease;
          }
          .desktop-nav a::after {
            content: ""; position: absolute; left: 0; right: 100%; bottom: -8px; height: 1px;
            background: var(--copper); transition: right .3s var(--ease);
          }
          .desktop-nav a:hover, .footer-nav a:hover { color: var(--gold); }
          .desktop-nav a:hover::after { right: 0; }
          .button {
            min-height: 50px; display: inline-flex; align-items: center; justify-content: center; gap: 14px;
            padding: 0 22px; border: 1px solid var(--copper); border-radius: 0; background: var(--copper);
            color: #191511; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
            cursor: pointer; transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s var(--ease), box-shadow .25s ease;
          }
          .button:hover { background: var(--gold); border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(197,139,93,.16); }
          .button svg { width: 15px; height: 15px; transition: transform .25s ease; }
          .button:hover svg { transform: translateX(3px); }
          .button-outline { color: var(--cream); background: transparent; border-color: rgba(224,189,145,.42); }
          .button-outline:hover { color: var(--ink); background: var(--gold); border-color: var(--gold); }
          .header-cta { min-height: 44px; padding-inline: 18px; font-size: 9px; }
          .menu-toggle { display: none; width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); background: transparent; cursor: pointer; }
          .menu-toggle span { display: block; width: 18px; height: 1px; margin: 5px auto; background: var(--cream); transition: transform .25s ease; }
          .menu-toggle[aria-expanded="true"] span:first-child { transform: translateY(3px) rotate(45deg); }
          .menu-toggle[aria-expanded="true"] span:last-child { transform: translateY(-3px) rotate(-45deg); }
          .mobile-nav { display: none; }

          .hero {
            position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0,.9fr) minmax(400px,1.1fr);
            align-items: center; gap: clamp(40px,6vw,92px); min-height: 770px; padding-block: 132px 88px;
          }
          .hero::before {
            content: ""; position: absolute; z-index: -1; top: 9%; left: -17%; width: 55vw; height: 65vw; max-height: 660px;
            background: radial-gradient(ellipse, rgba(130,78,43,.13), transparent 68%); pointer-events: none;
          }
          .hero-copy { position: relative; z-index: 2; padding-bottom: 5px; animation: rise-in .8s var(--ease) both; }
          .eyebrow {
            display: flex; align-items: center; gap: 12px; margin: 0 0 22px; color: var(--gold);
            font-size: 9px; font-weight: 700; letter-spacing: .24em; line-height: 1.4; text-transform: uppercase;
          }
          .eyebrow::before { content: ""; display: block; width: 30px; height: 1px; background: var(--copper); }
          h1, h2, h3, p { margin-top: 0; }
          .hero h1 {
            max-width: 680px; margin-bottom: 27px; color: var(--cream); font: 400 clamp(58px,7vw,103px)/.91 var(--serif);
            letter-spacing: -.065em;
          }
          .hero h1 em, .section-title em, .closing-title em { color: var(--gold); font-weight: 400; }
          .hero-lead { max-width: 430px; margin: 0 0 32px; color: #b3aaa0; font-size: 15px; line-height: 1.85; }
          .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 13px; }
          .hero-facts { display: flex; gap: clamp(28px,4vw,55px); margin-top: 55px; padding-top: 23px; border-top: 1px solid var(--line); }
          .fact { display: flex; align-items: baseline; gap: 11px; }
          .fact strong { color: var(--gold); font: 30px/1 var(--serif); }
          .fact span { max-width: 78px; color: #9b9288; font-size: 9px; letter-spacing: .12em; line-height: 1.5; text-transform: uppercase; }
          .hero-visual {
            position: relative; width: 100%; max-width: 630px; justify-self: end; aspect-ratio: .86;
            border: 1px solid rgba(224,189,145,.32); background: #26221e; box-shadow: 0 35px 90px rgba(0,0,0,.35);
            animation: reveal-image 1s .12s var(--ease) both;
          }
          .hero-visual::before, .hero-visual::after { content: ""; position: absolute; z-index: 2; pointer-events: none; }
          .hero-visual::before { inset: 12px; border: 1px solid rgba(235,205,165,.18); }
          .hero-visual::after { inset: 0; background: linear-gradient(180deg, rgba(15,13,11,.02) 55%, rgba(15,13,11,.55)); }
          .hero-illustration { display: block; width: 100%; height: 100%; object-fit: cover; }
          .visual-index {
            position: absolute; z-index: 3; top: 28px; right: 28px; color: rgba(240,221,194,.72);
            writing-mode: vertical-rl; font-size: 8px; letter-spacing: .22em; text-transform: uppercase;
          }
          .visual-note {
            position: absolute; z-index: 3; right: 23px; bottom: 24px; left: 23px; display: flex;
            align-items: end; justify-content: space-between; gap: 20px;
          }
          .visual-note small { display: block; margin-bottom: 6px; color: var(--gold); font-size: 8px; letter-spacing: .22em; text-transform: uppercase; }
          .visual-note strong { display: block; color: #f0e7db; font: 26px/1.08 var(--serif); font-weight: 400; }
          .visual-stamp {
            display: grid; place-items: center; width: 71px; height: 71px; flex: 0 0 71px; border: 1px solid rgba(224,189,145,.7);
            border-radius: 50%; color: var(--gold); font: 11px/1.3 var(--serif); text-align: center; transform: rotate(10deg);
          }
          .visual-stamp span { display: block; font: 7px/1.5 var(--sans); letter-spacing: .12em; text-transform: uppercase; }

          .ticker { overflow: hidden; border-block: 1px solid rgba(224,189,145,.17); background: rgba(255,255,255,.012); }
          .ticker-track { display: flex; align-items: center; justify-content: space-around; gap: 32px; width: min(1320px, calc(100% - 88px)); min-height: 67px; margin-inline: auto; }
          .ticker-item { display: inline-flex; align-items: center; gap: 23px; color: #b5aa9e; white-space: nowrap; font: 11px/1 var(--serif); letter-spacing: .13em; text-transform: uppercase; }
          .ticker-item::after { content: "✳"; color: var(--copper); font-size: 12px; }

          .section { padding-block: 125px; }
          .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 45px; margin-bottom: 46px; }
          .section-heading-copy { max-width: 720px; }
          .section-heading .eyebrow { margin-bottom: 18px; }
          .section-title { margin: 0; color: var(--cream); font: 400 clamp(42px,5.4vw,72px)/.98 var(--serif); letter-spacing: -.05em; }
          .section-intro { max-width: 375px; margin: 0 0 4px; color: var(--muted); font-size: 13px; line-height: 1.8; }
          .service-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 13px; }
          .service-card {
            position: relative; display: flex; min-height: 290px; flex-direction: column; align-items: flex-start; padding: 26px 24px 23px;
            border: 1px solid rgba(224,189,145,.14); background: linear-gradient(145deg, rgba(42,38,33,.83), rgba(25,23,20,.92));
            text-align: left; cursor: pointer; overflow: hidden;
            transition: transform .35s var(--ease), border-color .3s ease, background .3s ease, box-shadow .35s ease;
          }
          .service-card::before { content: ""; position: absolute; right: -50px; bottom: -85px; width: 190px; height: 190px; border: 1px solid rgba(197,139,93,.13); border-radius: 50%; transition: transform .5s var(--ease); }
          .service-card::after { content: ""; position: absolute; right: -18px; bottom: -52px; width: 135px; height: 135px; border: 1px solid rgba(197,139,93,.1); border-radius: 50%; }
          .service-card:hover { z-index: 1; transform: translateY(-7px); border-color: rgba(224,189,145,.54); background: linear-gradient(145deg, #302921, #211e1a); box-shadow: 0 22px 40px rgba(0,0,0,.22); }
          .service-card:hover::before { transform: scale(1.14); }
          .card-topline { display: flex; width: 100%; align-items: center; justify-content: space-between; margin-bottom: 37px; }
          .service-number { color: #81766a; font: 12px/1 var(--serif); letter-spacing: .09em; }
          .service-icon { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid rgba(224,189,145,.3); color: var(--gold); }
          .service-icon svg { width: 21px; height: 21px; }
          .service-card h3 { margin: 0 0 11px; color: var(--cream); font: 400 28px/1.1 var(--serif); letter-spacing: -.025em; }
          .service-card p { max-width: 245px; margin: 0 0 25px; color: #a79d92; font-size: 11px; line-height: 1.75; }
          .service-link { display: inline-flex; align-items: center; gap: 10px; margin-top: auto; color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
          .service-link svg { width: 13px; height: 13px; transition: transform .25s ease; }
          .service-card:hover .service-link svg { transform: translateX(4px); }
          .section-footnote { margin: 18px 0 0; color: #80786f; font-size: 10px; letter-spacing: .04em; }

          .about-band { position: relative; overflow: hidden; border-block: 1px solid rgba(224,189,145,.13); background: #1b1916; }
          .about-inner { display: grid; grid-template-columns: .92fr 1.08fr; align-items: center; gap: clamp(55px,10vw,150px); padding-block: 112px; }
          .about-art {
            position: relative; display: grid; place-items: center; width: 100%; min-height: 450px; overflow: hidden;
            border: 1px solid rgba(224,189,145,.26); background: radial-gradient(ellipse at 50% 44%, #49372a 0, #30271f 34%, #211d19 72%);
          }
          .about-art::before { content: ""; position: absolute; inset: 18px; border: 1px solid rgba(224,189,145,.19); }
          .about-art::after { content: ""; position: absolute; width: 330px; height: 330px; border: 1px solid rgba(224,189,145,.14); border-radius: 50%; box-shadow: 0 0 0 22px rgba(224,189,145,.025), 0 0 0 48px rgba(224,189,145,.025); }
          .about-orbit { position: relative; z-index: 1; display: grid; place-items: center; width: 230px; height: 230px; border: 1px solid rgba(224,189,145,.55); border-radius: 50%; color: var(--gold); }
          .about-orbit::before { content: ""; position: absolute; inset: 13px; border: 1px solid rgba(224,189,145,.22); border-radius: 50%; }
          .about-orbit::after { content: ""; position: absolute; width: 2px; height: 2px; top: 13%; right: 15%; border-radius: 50%; background: #e6c293; box-shadow: 0 0 15px 5px rgba(230,194,147,.6); }
          .about-monogram { font: 400 125px/.9 var(--serif); letter-spacing: -.11em; transform: translateX(-7px); }
          .about-ring-label { position: absolute; top: 50%; left: 50%; width: 310px; color: #c8ad8d; font-size: 8px; letter-spacing: .3em; text-align: center; text-transform: uppercase; transform: translate(-50%,-50%) rotate(-90deg); }
          .about-side-label { position: absolute; z-index: 2; right: 29px; bottom: 28px; color: rgba(231,207,176,.65); writing-mode: vertical-rl; font-size: 8px; letter-spacing: .19em; text-transform: uppercase; }
          .about-copy .eyebrow { margin-bottom: 20px; }
          .about-copy .section-title { margin-bottom: 23px; }
          .about-copy > p:not(.eyebrow) { max-width: 520px; margin-bottom: 30px; color: #b0a79d; font-size: 13px; line-height: 1.9; }
          .value-list { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 24px; padding: 0; margin: 0; list-style: none; }
          .value-list li { display: flex; align-items: center; gap: 10px; color: #d0c6ba; font-size: 10px; letter-spacing: .05em; }
          .value-list li::before { content: ""; width: 5px; height: 5px; flex: 0 0 5px; border: 1px solid var(--copper); transform: rotate(45deg); }

          .masters-section { padding-block: 126px 132px; }
          .masters-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 15px; }
          .master-card { min-width: 0; }
          .master-portrait {
            --portrait-a: #5b4637; --portrait-b: #25211c;
            position: relative; display: grid; place-items: center; aspect-ratio: .83; overflow: hidden;
            border: 1px solid rgba(224,189,145,.2); background:
              radial-gradient(ellipse at 50% 75%, rgba(8,8,8,.04), transparent 52%),
              radial-gradient(circle at 52% 37%, var(--portrait-a), var(--portrait-b) 69%, #1b1916 100%);
            transition: border-color .3s ease, filter .3s ease;
          }
          .master-card:hover .master-portrait { border-color: rgba(224,189,145,.65); filter: saturate(1.12); }
          .master-portrait::before {
            content: ""; position: absolute; width: 74%; aspect-ratio: 1; border: 1px solid rgba(230,198,159,.29); border-radius: 50%;
            box-shadow: 0 0 0 14px rgba(230,198,159,.035), 0 0 0 38px rgba(230,198,159,.025); transition: transform .65s var(--ease);
          }
          .master-card:hover .master-portrait::before { transform: scale(1.06); }
          .master-portrait::after { content: ""; position: absolute; inset: 11px; border: 1px solid rgba(230,198,159,.13); }
          .portrait-letter { position: relative; z-index: 1; color: rgba(241,222,197,.85); font: 400 clamp(95px,12vw,160px)/.9 var(--serif); letter-spacing: -.1em; transform: translateX(-7px); text-shadow: 0 14px 30px rgba(0,0,0,.3); }
          .portrait-index { position: absolute; z-index: 2; top: 25px; left: 24px; color: rgba(231,207,176,.68); font: 11px/1 var(--serif); letter-spacing: .14em; }
          .portrait-mark { position: absolute; z-index: 2; right: 24px; bottom: 24px; color: rgba(231,207,176,.78); font-size: 8px; letter-spacing: .2em; writing-mode: vertical-rl; text-transform: uppercase; }
          .master-card:nth-child(2) .master-portrait { --portrait-a: #4d443d; --portrait-b: #20201e; }
          .master-card:nth-child(3) .master-portrait { --portrait-a: #624e42; --portrait-b: #28201e; }
          .master-card:nth-child(4) .master-portrait { --portrait-a: #4e514b; --portrait-b: #20211f; }
          .master-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 19px; }
          .master-meta h3 { margin: 0 0 4px; color: var(--cream); font: 400 26px/1.05 var(--serif); }
          .master-meta span { color: #9f968c; font-size: 9px; letter-spacing: .15em; text-transform: uppercase; }
          .master-book {
            display: inline-flex; align-items: center; gap: 7px; padding: 7px 0 7px 10px; border: 0; background: transparent;
            color: var(--gold); font-size: 8px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; cursor: pointer;
          }
          .master-book svg { width: 13px; height: 13px; transition: transform .25s ease; }
          .master-book:hover svg { transform: translateX(3px); }
          .team-note { margin: 22px 0 0; color: #80786f; font-size: 10px; }

          .locations-section { position: relative; padding-block: 116px 128px; background: #191816; border-block: 1px solid rgba(224,189,145,.12); }
          .locations-section::before { content: ""; position: absolute; top: 0; right: 0; width: 40%; height: 100%; pointer-events: none; background: radial-gradient(ellipse at 85% 35%, rgba(135,88,51,.09), transparent 70%); }
          .locations-heading { position: relative; z-index: 1; margin-bottom: 43px; }
          .locations-heading .section-title { max-width: 760px; }
          .locations-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
          .location-card {
            position: relative; display: flex; min-height: 265px; flex-direction: column; align-items: flex-start; padding: 29px 31px 25px;
            border: 1px solid rgba(224,189,145,.18); background: linear-gradient(145deg, rgba(39,36,31,.92), rgba(29,27,24,.94)); overflow: hidden;
            transition: border-color .3s ease, transform .3s var(--ease), box-shadow .3s ease;
          }
          .location-card:hover { border-color: rgba(224,189,145,.47); transform: translateY(-4px); box-shadow: 0 18px 35px rgba(0,0,0,.17); }
          .location-card::before { content: ""; position: absolute; right: -30px; bottom: -100px; width: 245px; height: 245px; border: 1px solid rgba(224,189,145,.11); border-radius: 50%; box-shadow: 0 0 0 20px rgba(224,189,145,.02), 0 0 0 44px rgba(224,189,145,.02); }
          .location-top { display: flex; width: 100%; align-items: center; justify-content: space-between; margin-bottom: 30px; }
          .location-index { color: var(--gold); font: 14px/1 var(--serif); letter-spacing: .12em; }
          .location-pin { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(224,189,145,.3); color: var(--gold); }
          .location-pin svg { width: 15px; height: 15px; }
          .location-card h3 { position: relative; margin: 0 0 8px; color: var(--cream); font: 400 clamp(27px,3vw,37px)/1.05 var(--serif); letter-spacing: -.035em; }
          .location-card p { position: relative; margin: 0 0 25px; color: #9c9389; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }
          .location-actions { position: relative; display: flex; align-items: center; gap: 24px; margin-top: auto; }
          .text-button, .copy-button {
            display: inline-flex; align-items: center; gap: 8px; padding: 7px 0; border: 0; background: transparent;
            color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
          }
          .text-button svg, .copy-button svg { width: 13px; height: 13px; transition: transform .25s ease; }
          .text-button:hover svg { transform: translateX(3px); }
          .copy-button { color: #a89d91; font-size: 8px; }
          .copy-button:hover { color: var(--gold); }

          .closing-wrap { padding-block: 118px 94px; }
          .closing-panel {
            position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 45px; overflow: hidden;
            min-height: 285px; padding: 58px clamp(30px,7vw,98px); border: 1px solid rgba(224,189,145,.33);
            background: radial-gradient(ellipse at 86% 25%, rgba(151,93,51,.16), transparent 42%), linear-gradient(130deg,#211e1a,#181715);
          }
          .closing-panel::after { content: "Т"; position: absolute; right: 24%; top: 50%; color: rgba(224,189,145,.04); font: 400 320px/.8 var(--serif); transform: translateY(-45%); pointer-events: none; }
          .closing-copy { position: relative; z-index: 1; max-width: 680px; }
          .closing-copy .eyebrow { margin-bottom: 17px; }
          .closing-title { margin: 0 0 15px; color: var(--cream); font: 400 clamp(40px,5vw,66px)/.98 var(--serif); letter-spacing: -.05em; }
          .closing-copy p:last-child { margin: 0; color: #a99f95; font-size: 12px; }

      bindEvents() {
        this.root.addEventListener("click", (event) => {
          const toggle = event.target.closest("[data-menu-toggle]");
          if (toggle) {
            const nav = this.root.querySelector(".mobile-nav");
            const isOpen = toggle.getAttribute("aria-expanded") === "true";
            toggle.setAttribute("aria-expanded", String(!isOpen));
            toggle.setAttribute("aria-label", isOpen ? "Открыть меню" : "Закрыть меню");
            nav.classList.toggle("is-open", !isOpen);
            return;
          }

          const mobileLink = event.target.closest("[data-mobile-link]");
          if (mobileLink) {
            this.root.querySelector(".mobile-nav").classList.remove("is-open");
            const menuToggle = this.root.querySelector("[data-menu-toggle]");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "Открыть меню");
          }

          const closeButton = event.target.closest("[data-close-booking]");
          if (closeButton) {
            this.closeBooking();
            return;
          }

          const copyButton = event.target.closest("[data-copy]");
          if (copyButton) {
            this.copyAddress(copyButton.dataset.copy);
            return;
          }

          const serviceCard = event.target.closest("[data-service]");
          if (serviceCard) {
            this.openBooking({ service: serviceCard.dataset.service });
            return;
          }

          const masterButton = event.target.closest("[data-master]");
          if (masterButton) {
            this.openBooking({ master: masterButton.dataset.master });
            return;
          }

          const locationButton = event.target.closest("[data-location]");
          if (locationButton) {
            this.openBooking({ location: locationButton.dataset.location });
            return;
          }

          const openButton = event.target.closest("[data-open-booking]");
          if (openButton) this.openBooking();
        });

        this.form.addEventListener("submit", (event) => this.handleSubmit(event));
        this.dialog.addEventListener("click", (event) => {
          if (event.target === this.dialog) this.closeBooking();
        });
        this.dialog.addEventListener("close", () => this.resetBooking());
        this.onScroll = () => this.header.classList.toggle("is-scrolled", window.scrollY > 16);
        window.addEventListener("scroll", this.onScroll, { passive: true });
        this.onScroll();
      }

      openBooking(prefill = {}) {
        this.resetBooking();
        const service = this.root.querySelector("#booking-service");
        const master = this.root.querySelector("#booking-master");
        const location = this.root.querySelector("#booking-location");
        if (prefill.service) service.value = prefill.service;
        if (prefill.master) master.value = prefill.master;
        if (prefill.location) location.value = prefill.location;
        if (typeof this.dialog.showModal === "function") this.dialog.showModal();
        else this.dialog.setAttribute("open", "");
        window.setTimeout(() => this.root.querySelector("#booking-name").focus(), 50);
      }

      closeBooking() {
        if (this.dialog.open && typeof this.dialog.close === "function") this.dialog.close();
        else {
          this.dialog.removeAttribute("open");
          this.resetBooking();
        }
      }

      resetBooking() {
        if (this.form) this.form.reset();
        if (this.form) this.form.hidden = false;
        if (this.success) this.success.hidden = true;
      }

      handleSubmit(event) {
        event.preventDefault();
        if (!this.form.reportValidity()) return;
        this.form.hidden = true;
        this.success.hidden = false;
        const name = this.form.elements.name.value.trim();
        const greeting = this.root.querySelector(".success-message");
        greeting.textContent = `${name ? `${name}, заявка подготовлена.` : "Заявка подготовлена."} Данные никуда не отправлены — подключите обработчик формы, чтобы принимать реальные записи.`;
      }

      async copyAddress(address) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(address);
          } else {
            const temporary = document.createElement("textarea");
            temporary.value = address;
            temporary.setAttribute("readonly", "");
            temporary.style.position = "fixed";
            temporary.style.opacity = "0";
            document.body.appendChild(temporary);
            temporary.select();
            document.execCommand("copy");
            temporary.remove();
          }
          this.showToast("Адрес скопирован: " + address);
        } catch (error) {
          this.showToast(address);
        }
      }

      showToast(message) {
        const toast = this.root.querySelector(".toast");
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(this.toastTimer);
        this.toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2500);
      }
    }

    new TrukhinyLanding();
  </script>
